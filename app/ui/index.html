<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>飞书 Bot 桥</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.png">
<style>
:root{--blue:#3370ff;--blue-d:#245bdb;--blue-l:#e1eaff;--blue-xl:#f0f4ff;--bg:#f5f7fa;--card:#fff;--line:#e4e7ed;--t1:#1f2329;--t2:#646a73;--t3:#8f959e;--green:#00b365;--orange:#ff8800;--red:#f54a45;--r:10px;--sh:0 1px 2px rgba(31,35,41,.04),0 2px 8px rgba(31,35,41,.06)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--t1);display:flex;overflow:hidden}
aside{width:212px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:16px;display:block}.brand small{color:var(--t3);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--t2);cursor:pointer;text-decoration:none;margin-bottom:2px;user-select:none}
.nav a:hover{background:var(--bg)}.nav a.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}.nav .cnt{margin-left:auto;font-size:12px;background:var(--bg);border-radius:10px;padding:0 8px;color:var(--t3)}
.nav a.on .cnt{background:#fff;color:var(--blue)}
.side-foot{margin-top:auto;font-size:12px;color:var(--t3);padding:10px 8px;border-top:1px solid var(--line)}
.side-foot .ok{color:var(--green)}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:18px;flex:1}.top .sub{color:var(--t3);font-size:13px;font-weight:400;margin-left:8px}
.content{flex:1;min-height:0;overflow:hidden;padding:24px 28px;display:flex;gap:20px;align-items:stretch}
.content>.empty{align-self:flex-start}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font:inherit;color:var(--t1);white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.d{color:var(--red)}.btn.d:hover{border-color:var(--red);background:#fef0f0}.btn.sm{height:28px;padding:0 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}.stat small{color:var(--t3)}.stat b{display:block;font-size:24px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bot{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.bot:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(31,35,41,.1)}.bot.sel{border-color:var(--blue)}
.bot .h{display:flex;align-items:center;gap:10px}.av{width:36px;height:36px;border-radius:9px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.bot .nm{flex:1;min-width:0}.bot .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bot .nm small{color:var(--t3);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#c0c4cc;flex:none;display:inline-block}
.dot.running{background:var(--green);box-shadow:0 0 0 3px #00b36522}.dot.restarting{background:var(--orange);box-shadow:0 0 0 3px #ff880022;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--bg);color:var(--t2)}
.tag.g{background:#e4f8ee;color:#00875a}.tag.o{background:#fff3e5;color:#d46b00}.tag.b{background:var(--blue-l);color:var(--blue)}.tag.r{background:#fde2e2;color:#d83931}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--t3);border-top:1px solid var(--line);padding-top:10px}
.sw{position:relative;width:36px;height:20px;flex:none}.sw input{display:none}
.sw span{position:absolute;inset:0;background:#d0d3d6;border-radius:10px;transition:.2s;cursor:pointer}
.sw span:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.sw input:checked+span{background:var(--blue)}.sw input:checked+span:after{left:18px}
.panel{width:420px;flex:none;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);align-self:flex-start;max-height:100%;min-height:0;display:flex;flex-direction:column}
.panel .ph{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.panel .ph b{flex:1;font-size:15px}
.panel form{padding:4px 20px 16px;overflow:auto;flex:1;min-height:0}.panel .ph,.panel .pf{flex:none}.panel .pf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sec{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.5px;margin:18px 0 4px}
.f{margin-top:10px}.f label{display:block;font-size:13px;color:var(--t2);margin-bottom:4px}.f label em{font-style:normal;font-size:12px;margin-left:6px}
.f label em.y{color:var(--green)}.f label em.n{color:var(--t3)}
.in{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:inherit;outline:none;background:#fff;transition:.15s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}.row div small{display:block;color:var(--t3);font-size:12px}
.empty{flex:1;text-align:center;padding:70px 20px;color:var(--t3);background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.empty svg{width:120px;height:96px;margin-bottom:10px}.empty h3{color:var(--t1);margin:6px 0;font-size:16px}.empty p{margin:0 0 18px}
.panel .empty{box-shadow:none;padding:60px 24px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#fff;box-shadow:0 6px 24px #0002;border-radius:8px;padding:10px 18px;transition:.25s;z-index:9;display:flex;gap:8px;align-items:center}
.toast.show{transform:translateX(-50%)}.toast.err{color:var(--red)}
.logbar{display:flex;gap:10px;margin-bottom:12px;align-items:center}.logbar .in{width:auto}.logbar .grow{flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}.seg button{border:0;background:none;padding:4px 12px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;color:var(--t2)}
.seg button.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.logs{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;width:100%;flex:1;min-height:0}
.logs .l{display:grid;grid-template-columns:150px 120px 56px 1fr;gap:12px;padding:7px 16px;border-bottom:1px solid #f0f1f3;font-size:13px;align-items:baseline}
.logs .l:hover{background:var(--blue-xl)}.logs .l time{color:var(--t3);font:12px Consolas,Menlo,monospace}.logs .l .b{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-size:11px;padding:0 6px;border-radius:3px;text-align:center}.lv.info{background:var(--bg);color:var(--t2)}.lv.warn{background:#fff3e5;color:#d46b00}.lv.error{background:#fde2e2;color:#d83931}
.logs .m{word-break:break-all}.wide{flex:1;min-width:0;height:100%;overflow:auto}.wide.col{display:flex;flex-direction:column;overflow:hidden}.wide.col .logbar{flex:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:6px 20px;margin-bottom:16px;max-width:760px}.card h4{margin:14px 0 4px}
code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px}
.mini{display:flex;gap:6px;align-items:center;font-size:13px}
</style></head><body>
<aside>
 <div class="brand"><img src="/icon.png" alt=""><div><b>飞书 Bot 桥</b><small>Feishu ↔ Grok Bot</small></div></div>
 <nav class="nav">
  <a data-v="bots" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4M9 13h.01M15 13h.01"/></svg>机器人<span class="cnt" id="nb">0</span></a>
  <a data-v="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>运行日志</a>
  <a data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</a>
 </nav>
 <div class="side-foot"><span class="ok">●</span> 服务运行中 · 端口 <span id="port">-</span><br>版本 v<span id="ver">-</span></div>
</aside>
<main>
 <div class="top"><h2 id="title">机器人<span class="sub" id="subt"></span></h2><span id="topacts"></span></div>
 <div class="content" id="content"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stName={running:'已连接',stopped:'已停止',restarting:'重连中'};
let view='bots',bots=[],cur=null,editing=false,status={},lf={bot:'',lv:'',q:''},logCache=[];
function ago(t){if(!t)return '暂无';const s=Date.now()/1e3-t;if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return new Date(t*1e3).toLocaleDateString('zh-CN')}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='toast show'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',2400)}
const EMPTY_BOT=`<svg viewBox="0 0 120 96"><rect x="20" y="26" width="80" height="58" rx="14" fill="#e1eaff"/><rect x="34" y="40" width="52" height="30" rx="8" fill="#fff"/><circle cx="50" cy="55" r="5" fill="#3370ff"/><circle cx="70" cy="55" r="5" fill="#3370ff"/><path d="M60 26V12" stroke="#3370ff" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="10" r="5" fill="#00d6b9"/></svg>`;
const EMPTY_LOG=`<svg viewBox="0 0 120 96"><rect x="26" y="14" width="68" height="74" rx="10" fill="#e1eaff"/><path d="M40 36h40M40 50h40M40 64h24" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`;
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v){view=v;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));render(true)}
async function refresh(){try{bots=await api('/api/bots');status=await api('/api/status')}catch(e){return}
 $('#nb').textContent=bots.length;$('#port').textContent=status.port;$('#ver').textContent=status.version||'';
 if(view=='bots')softBots();else if(view=='logs')renderLogs();}
function render(full){if(view=='bots'){editing=false;renderBots(true)}else if(view=='logs')renderLogs(true);else renderSettings()}
function syncTag(b){if(!b.sync_enabled)return '<span class="tag">同步关闭</span>';if(b.sync_error)return '<span class="tag r">同步异常</span>';return '<span class="tag b">聊天同步中</span>'}
function botTitle(){$('#title').innerHTML='机器人<span class="sub">'+bots.filter(b=>b.state=='running').length+' / '+bots.length+' 已连接</span>'}
function leftHtml(){
 const run=bots.filter(b=>b.state=='running').length,syn=bots.filter(b=>b.sync_enabled).length,last=Math.max(0,...bots.map(b=>b.last_msg_at||0));
 const cards=bots.map(b=>`<div class="bot ${b.id==cur?'sel':''}" onclick="openEdit('${b.id}')">
  <div class="h"><div class="av">${esc((b.name||'?').slice(0,1))}</div><div class="nm"><b>${esc(b.name)}</b><small>${esc(b.id)}</small></div>
  <label class="sw" title="启用" onclick="event.stopPropagation()"><input type="checkbox" ${b.enabled?'checked':''} onchange="toggle('${b.id}',this.checked)"><span></span></label></div>
  <div class="tags"><span class="tag ${b.state=='running'?'g':b.state=='restarting'?'o':''}"><span class="dot ${b.state}"></span> ${stName[b.state]}</span>${syncTag(b)}${b.group_all?'<span class="tag">群聊全部</span>':''}${b.enabled?'':'<span class="tag">未启用</span>'}</div>
  <div class="meta"><span>最近消息 ${ago(b.last_msg_at)}</span><span>${b.sync_enabled?'同步 '+ago(b.last_sync_at):(b.restarts?'重启 '+b.restarts+' 次':'')}</span></div></div>`).join('');
 return `<div class="stats"><div class="stat"><small>机器人</small><b>${bots.length}</b></div><div class="stat"><small>已连接</small><b style="color:var(--green)">${run}</b></div><div class="stat"><small>聊天同步</small><b style="color:var(--blue)">${syn}</b></div><div class="stat"><small>最近消息</small><b style="font-size:18px;line-height:36px">${ago(last||null)}</b></div></div><div class="grid">${cards}</div>`}
// Full rebuild: first load, nav switch, open/close/save/delete. Keeps list scroll; keeps form scroll if the same bot stays open.
function renderBots(){
 botTitle();
 $('#topacts').innerHTML='<button class="btn" onclick="doImport()">导入旧配置</button> <button class="btn p" onclick="openEdit(null)">＋ 新增机器人</button>';
 const c=$('#content');
 if(!bots.length&&!editing){c.innerHTML=`<div class="empty">${EMPTY_BOT}<h3>还没有机器人</h3><p>添加一个飞书机器人，把消息转发给 Grok Bot</p><button class="btn p" onclick="openEdit(null)">＋ 新增机器人</button> <button class="btn" onclick="doImport()">导入旧配置</button></div>`;return}
 const ow=$('#wide'),of=$('#f'),op=$('#panel'),wTop=ow?ow.scrollTop:0,fTop=of&&op&&op.dataset.cur===String(cur??'')?of.scrollTop:0;
 const h=leftHtml();
 c.innerHTML=`<div class="wide" id="wide">${h}</div><div class="panel" id="panel" data-cur="${esc(cur??'')}">${panelHtml()}</div>`;
 const w=$('#wide');w._h=h;w.scrollTop=wTop;
 if(cur!==undefined&&cur!==null||editing)fillForm();
 const f=$('#f');if(f&&fTop)f.scrollTop=fTop;}
// Periodic refresh: update list/stats/status in place; never rebuild the open config form.
function softBots(){
 const w=$('#wide');
 if(!w||(!bots.length&&!editing))return renderBots();
 const b=cur!=null?bots.find(x=>x.id==cur):null;
 if(cur!=null&&!b){cur=null;editing=false;return renderBots()}
 botTitle();
 const h=leftHtml();if(h!==w._h){const t=w.scrollTop;w.innerHTML=h;w._h=h;w.scrollTop=t}
 if(b&&$('#f')){const d=$('#panel .ph .dot');if(d)d.className='dot '+b.state;const n=$('#pname');if(n)n.textContent=b.name;
  const ss=$('#ss');if(ss)ss.textContent=b.state=='stopped'?'启动':'停止';
  if(!editing)fillForm();}}
function ssAct(){const b=bots.find(x=>x.id==cur);return b&&b.state=='stopped'?'start':'stop'}
function panelHtml(){
 if(cur===null&&!editing)return `<div class="empty">${EMPTY_BOT}<h3>选择一个机器人</h3><p>点击左侧卡片查看详情和编辑配置</p></div>`;
 const b=bots.find(x=>x.id==cur);
 return `<div class="ph">${b?`<span class="dot ${b.state}"></span>`:''}<b id="pname">${b?esc(b.name):'新增机器人'}</b>${b?`<button class="btn sm" onclick="showLogs('${b.id}')">查看日志</button>`:''}<button class="btn sm" onclick="closeEdit()">✕</button></div>
 <form id="f" onsubmit="save(event)" oninput="editing=true">
  <div class="sec">基本信息</div>
  <div class="f"><label>名称</label><input class="in" name="name" required></div>
  <div class="f"><label>App ID</label><input class="in" name="app_id" placeholder="cli_xxx"></div>
  <div class="f"><label>App Secret <em id="s1"></em></label><input class="in" type="password" name="app_secret" autocomplete="new-password" placeholder="留空则保持不变"></div>
  <div class="sec">Webhook 转发</div>
  <div class="f"><label>Webhook URL</label><input class="in" name="webhook_url"></div>
  <div class="f"><label>Webhook Key <em id="s2"></em></label><input class="in" type="password" name="webhook_key" autocomplete="new-password" placeholder="留空则保持不变"></div>
  <div class="f"><label>主人 open_id（可选，逗号分隔）</label><input class="in" name="owner_open_id"></div>
  <div class="f"><label>机器人 open_id（留空自动获取）</label><input class="in" name="bot_open_id"></div>
  <div class="sec">Grok → 飞书 聊天同步</div>
  <div class="f"><label>Grok agent_id</label><input class="in" name="agent_id"></div>
  <div class="f"><label>飞书单聊 chat_id（oc_…）</label><input class="in" name="sync_chat_id"></div>
  <div class="sec">开关</div>
  <div class="row"><div>启用<small>启动时自动连接飞书</small></div><label class="sw"><input type="checkbox" name="enabled"><span></span></label></div>
  <div class="row"><div>群聊接收全部消息<small>GROUP_ALL，不需要 @</small></div><label class="sw"><input type="checkbox" name="group_all"><span></span></label></div>
  <div class="row"><div>聊天同步<small>读取本机 Grok Bot 聊天记录</small></div><label class="sw"><input type="checkbox" name="sync_enabled"><span></span></label></div>
 </form>
 <div class="pf"><button class="btn p" onclick="save(event)">保存</button>${b?`<button class="btn" id="ss" onclick="act(ssAct())">${b.state=='stopped'?'启动':'停止'}</button><button class="btn" onclick="testHook()">测试 Webhook</button><span style="flex:1"></span><button class="btn d" onclick="del()">删除</button>`:''}</div>`}
const TF=['name','app_id','webhook_url','owner_open_id','bot_open_id','agent_id','sync_chat_id'];
function fillForm(){const f=$('#f');if(!f)return;const b=bots.find(x=>x.id==cur);if(!b){f.enabled.checked=true;return}
 for(const k of TF)f[k].value=b[k]||'';for(const k of['enabled','group_all','sync_enabled'])f[k].checked=!!b[k];
 for(const[id,on]of[['s1',b.app_secret_set],['s2',b.webhook_key_set]]){const e=document.getElementById(id);if(e){e.className=on?'y':'n';e.textContent=on?'● 已设置':'未设置'}}}
function openEdit(id){cur=id;editing=id===null;renderBots();if(id===null)editing=true}
function closeEdit(){cur=null;editing=false;renderBots()}
async function save(e){e.preventDefault();const f=$('#f'),d={};for(const k of[...TF,'app_secret','webhook_key'])d[k]=f[k].value.trim();for(const k of['enabled','group_all','sync_enabled'])d[k]=f[k].checked;
 if(!d.name)return toast('请填写名称',1);
 try{const b=await api(cur?'/api/bots/'+cur:'/api/bots',{method:cur?'PUT':'POST',body:JSON.stringify(d)});toast('已保存');editing=false;cur=b.id;await refresh();renderBots()}catch(x){toast('保存失败：'+x.message,1)}}
async function act(a){try{await api(`/api/bots/${cur}/${a}`,{method:'POST'});toast(a=='start'?'已启动':'已停止')}catch(x){toast('失败：'+x.message,1)}editing=false;refresh()}
async function toggle(id,on){try{await api('/api/bots/'+id,{method:'PUT',body:JSON.stringify({enabled:on})});toast(on?'已启用':'已停用')}catch(x){toast(x.message,1)}refresh()}
async function testHook(){toast('测试中…');try{const r=await api(`/api/bots/${cur}/test`,{method:'POST'});toast(`Webhook 返回 HTTP ${r.status} ${r.ok?'✅':'❌'}`,!r.ok)}catch(x){toast('失败：'+x.message,1)}}
async function del(){if(!confirm('确定删除该机器人？'))return;await api('/api/bots/'+cur,{method:'DELETE'});toast('已删除');closeEdit();refresh()}
async function doImport(){const p=prompt('旧版 feishu-bridge 目录路径','');if(!p)return;try{const r=await api('/api/import',{method:'POST',body:JSON.stringify({path:p})});toast('已导入 '+r.length+' 个机器人（均未启用）');refresh()}catch(x){toast('导入失败：'+x.message,1)}}
function showLogs(id){lf.bot=id;go('logs')}
async function renderLogs(first){
 $('#title').innerHTML='运行日志<span class="sub">最近 500 条，自动刷新</span>';$('#topacts').innerHTML='';
 const c=$('#content');
 if(first||!$('#lg')){c.innerHTML=`<div class="wide col"><div class="logbar"><select class="in" id="fb" onchange="lf.bot=this.value;drawLogs()"><option value="">全部来源</option><option value="system">系统</option>${bots.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')}</select>
  <div class="seg" id="fl">${[['','全部'],['info','信息'],['warn','警告'],['error','错误']].map(([v,t])=>`<button data-l="${v}" class="${lf.lv==v?'on':''}">${t}</button>`).join('')}</div>
  <input class="in grow" id="fq" placeholder="搜索日志内容…" value="${esc(lf.q)}" oninput="lf.q=this.value;drawLogs()"><button class="btn" onclick="logCache=[];drawLogs()">清空显示</button></div><div class="logs" id="lg"></div></div>`;
  $('#fb').value=lf.bot;document.querySelectorAll('#fl button').forEach(b=>b.onclick=()=>{lf.lv=b.dataset.l;document.querySelectorAll('#fl button').forEach(x=>x.classList.toggle('on',x==b));drawLogs()});}
 try{logCache=await api('/api/logs?limit=500')}catch(e){}drawLogs()}
function drawLogs(){const name=Object.fromEntries(bots.map(b=>[b.id,b.name]));name.system='系统';const q=lf.q.toLowerCase();
 const l=logCache.filter(e=>(!lf.bot||e.bot==lf.bot)&&(!lf.lv||e.level==lf.lv)&&(!q||(e.msg+e.bot).toLowerCase().includes(q))).slice().reverse();
 const lg=$('#lg');if(!lg)return;const st=lg.scrollTop;lg.innerHTML=l.length?l.map(e=>`<div class="l"><time>${new Date(e.ts*1e3).toLocaleString('zh-CN',{hour12:false})}</time><span class="b">${esc(name[e.bot]||e.bot)}</span><span class="lv ${e.level}">${{info:'信息',warn:'警告',error:'错误'}[e.level]||e.level}</span><span class="m">${esc(e.msg)}</span></div>`).join(''):`<div class="empty" style="box-shadow:none">${EMPTY_LOG}<h3>没有匹配的日志</h3><p>调整筛选条件，或等待新的事件</p></div>`;lg.scrollTop=st}
function renderSettings(){
 $('#title').innerHTML='设置';$('#topacts').innerHTML='';
 $('#content').innerHTML=`<div class="wide"><div class="card"><h4>常规</h4>
  <div class="row"><div>开机自启<small>登录后最小化到托盘运行</small></div><label class="sw"><input type="checkbox" id="auto" ${status.autostart?'checked':''}><span></span></label></div>
  <div class="row"><div>我的显示名<small>Grok 里自己发的消息同步到飞书时的卡片标题</small></div><input id="uname" style="width:160px" maxlength="40" placeholder="桔子"></div>
  <div class="row"><div>关闭窗口<small>关闭按钮会隐藏到托盘；从托盘菜单「退出」才会结束程序</small></div></div></div>
  <div class="card"><h4>本地接口</h4><div class="row"><div>回复接口<small>POST <code>http://127.0.0.1:${status.port}/reply</code>，需 <code>Authorization: Bearer &lt;本地 token&gt;</code></small></div></div>
  <div class="row"><div>数据目录<small><code>${esc(status.data_dir)}</code></small></div></div></div>
  <div class="card"><h4>导入</h4><div class="row"><div>从旧版 feishu-bridge 导入<small>导入的机器人默认未启用</small></div><button class="btn" onclick="doImport()">导入旧配置</button></div></div>
  <div class="card"><h4>关于</h4><div class="row"><div>飞书 Bot 桥 v${status.version||''}<small>Feishu ↔ Grok Bot 消息桥</small></div></div></div></div>`;
 api('/api/settings').then(r=>{const u=$('#uname');if(u)u.value=r.user_display_name||''}).catch(()=>{});
 $('#uname').onchange=async e=>{try{const r=await api('/api/settings',{method:'POST',body:JSON.stringify({user_display_name:e.target.value})});e.target.value=r.user_display_name;toast('显示名已保存：'+r.user_display_name)}catch(x){toast(x.message,1)}};
 $('#auto').onchange=async e=>{try{const r=await api('/api/autostart',{method:'POST',body:JSON.stringify({enabled:e.target.checked})});toast(r.enabled?'已开启开机自启':'已关闭开机自启')}catch(x){toast(x.message,1)}}}
refresh().then(()=>render(true));setInterval(refresh,3000);
</script></body></html>
